# This file is a TEMPLATE for Octopus Deploy Inline YAML
# Copy this content into the "Inline YAML" field in Octopus Deploy step

image:
  tag: "#{Octopus.Release.Number}"

imagePullSecrets:
  - name: craas-onlyspans-private

env:
  # Database Configuration (use DSN for simplified configuration)
  POSTGRES_DSN: "postgres://#{Postgres.User}:#{Postgres.Password}@#{Postgres.Host}:#{Postgres.Port}/#{Postgres.Database}?sslmode=require"

  # Feature Flags
  KAFKA_ENABLED: "false"  # Enable Kafka consumer (set to "false" for HTTP-only mode)
  AUTO_MIGRATE: "true"   # Run database migrations on startup

  # Kafka Configuration (only used when KAFKA_ENABLED=true)
  # Use comma-separated list for multiple brokers: "broker1:9092,broker2:9092,broker3:9092"
  KAFKA_BROKERS: "#{Kafka.Host}:#{Kafka.Port}"
  KAFKA_TOPIC: "events"
  KAFKA_GROUP_ID: "events-group"
  KAFKA_USERNAME: "#{Kafka.Username}"
  KAFKA_PASSWORD: "#{Kafka.Password}"

  # Server Configuration
  SERVER_PORT: "8080"

  # Event Retention
  RETENTION_PERIOD_DAYS: "90"
  RETENTION_CRON: "0 2 * * *"

  # Export Limits
  MAX_EXPORT_SIZE: "10000"
