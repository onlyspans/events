name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./internal/service/...

      - name: Run integration tests
        run: go test -v -race -coverprofile=coverage-integration.out ./internal/repository/...

      - name: Combine coverage reports
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge coverage.out coverage-integration.out > coverage-combined.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-combined.out
          flags: unittests
          fail_ci_if_error: false
