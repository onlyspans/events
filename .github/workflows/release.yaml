name: Release
concurrency: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: onlyspans-private.registry.twcstorage.ru
  IMAGE_NAME: events
  OCTOPUS_PROJECT: events
  OCTOPUS_SPACE: Default
  OCTOPUS_SERVER_URL: http://octopus.onlyspans.ru

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/service/...

      - name: Run integration tests
        run: go test -v -race -coverprofile=coverage-integration.out -covermode=atomic ./internal/repository/...

      - name: Combine coverage reports
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge coverage.out coverage-integration.out > coverage.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
          retention-days: 5

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Build and Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release number
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.${COMMIT_COUNT}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build Docker images
        run: |
          # Build main image
          docker build . --rm --no-cache \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --build-arg REVISION='${{ github.sha }}' \
            --build-arg VERSION='${{ steps.version.outputs.version }}'

      - name: Push Docker images
        run: |
          # Push main images
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create Octopus release
        uses: docker://octopusdeploy/octo:latest
        env:
          OCTOPUS_CLI_SERVER: ${{ env.OCTOPUS_SERVER_URL }}
          OCTOPUS_CLI_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
        with:
          args: >-
            create-release
            --project ${{ env.OCTOPUS_PROJECT }}
            --version ${{ steps.version.outputs.version }}
            --packageVersion ${{ steps.version.outputs.version }}
            --space ${{ env.OCTOPUS_SPACE }}
            --releaseNotes "Release ${{ steps.version.outputs.version }} - Commit: ${{ github.sha }}"

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}

            ### Commit
            ${{ github.sha }}

            ### Triggered by
            @${{ github.actor }}
          files: coverage.txt
          draft: false
          prerelease: false
