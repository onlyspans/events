services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-events}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  events:
    build: .
    ports:
      - '8080:8080'
    environment:
      # Database configuration (DSN format)
      - POSTGRES_DSN=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-events}?sslmode=disable

      # Feature flags (Kafka disabled by default)
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}

      # Kafka configuration (only used if KAFKA_ENABLED=true)
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:29092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-event-logs}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-event-logs-group}

      # Server configuration
      - SERVER_PORT=8080
      - RETENTION_PERIOD_DAYS=${RETENTION_PERIOD_DAYS:-90}
      - RETENTION_CRON=${RETENTION_CRON:-0 2 * * *}
      - MAX_EXPORT_SIZE=${MAX_EXPORT_SIZE:-10000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Kafka infrastructure (optional - enable with: docker compose --profile kafka up)
  zookeeper:
    image: 'confluentinc/cp-zookeeper:7.5.0'
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: 'confluentinc/cp-kafka:7.5.0'
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
      - '9101:9101'
    volumes:
      - ./data/kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5